[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-model-checkpoint"
version = "0.1.0"
description = "P2P model checkpoint sharing over IPFS + libp2p"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aaryan" }]

dependencies = [
    "libp2p>=0.7.0",
    "trio>=0.30",
    "multiaddr>=0.0.9",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-trio>=0.8"]

[project.scripts]
p2p-checkpoint-peer = "run_peer:main"

[tool.pytest.ini_options]
trio_mode = true
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["p2p_checkpoint*"]
